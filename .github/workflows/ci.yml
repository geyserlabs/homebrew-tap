name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - run: make check
      - name: Install and test published formula
        if: ${{ hashFiles('Formula/geyser.rb') != '' }}
        run: |
          brew untap geyserlabs/tap 2>/dev/null || true
          brew tap --custom-remote geyserlabs/tap "file://$GITHUB_WORKSPACE"
          brew install geyserlabs/tap/geyser
          brew test geyserlabs/tap/geyser
          brew audit --strict --online geyserlabs/tap/geyser
          brew uninstall geyser

  pr-gate:
    name: pr-gate
    if: always()
    needs: check
    runs-on: macos-14
    timeout-minutes: 3
    steps:
      - name: Require the complete tap gate
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          set -euo pipefail
          [[ "$CHECK_RESULT" == "success" ]] || {
            echo "Homebrew tap gate did not pass: $CHECK_RESULT" >&2
            exit 1
          }

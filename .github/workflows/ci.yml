name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - run: make check
      - name: Install and test published formula
        if: ${{ hashFiles('Formula/geyser.rb') != '' }}
        run: |
          brew tap geyserlabs/tap
          brew install --formula Formula/geyser.rb
          brew test geyser
          brew uninstall geyser
